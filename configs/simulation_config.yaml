# ==============================================================================
# Simulation Environment Configuration
# ==============================================================================

environment:
  width: 100.0          # meters
  height: 100.0         # meters
  resolution: 0.5       # meters per grid cell (200x200 grid)
  urban_zones:
    - name: "parking_lot_north"
      bounds: [10.0, 70.0, 40.0, 95.0]
      vehicle_prior_probability: 0.85
    - name: "commercial_avenue"
      bounds: [45.0, 10.0, 55.0, 90.0]
      vehicle_prior_probability: 0.60
    - name: "residential_cul_de_sac"
      bounds: [60.0, 20.0, 90.0, 60.0]
      vehicle_prior_probability: 0.40

targets:
  - target_id: "target_car_alpha"
    true_position: [25.0, 85.0]
    license_plate: "DXB-77492"
    vehicle_class: "sedan"
    color: "black"

simulation_runner:
  time_step_sec: 0.1
  max_simulation_time_sec: 600.0
  render_fps: 15
  headless: false
