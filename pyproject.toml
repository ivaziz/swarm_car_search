[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm_car_search"
version = "1.0.0"
description = "Autonomous Multi-Robot Swarm for Missing Vehicle Search & Identification in Outdoor Urban Environments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mohammed & Ibrahim", email = "swarm-robotics@graduation-project.local"}
]
keywords = [
    "swarm-robotics",
    "ant-colony-optimization",
    "multi-robot-task-allocation",
    "stigmergy",
    "urban-search",
    "stolen-car-identification"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0"
]
yaml = [
    "pyyaml>=6.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
swarm-sim = "scripts.run_simulation:main"
swarm-eval = "scripts.run_evaluation:main"
swarm = "scripts.main:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "output*"]
